<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coursera Test</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --accent-2: #34d399;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 45%, #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .container {
        width: min(900px, 100%);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        padding: 48px 32px;
      }

      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.15);
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: bold;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      .button {
        display: inline-block;
        padding: 14px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        opacity: 0.95;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #04111d;
      }

      .secondary {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: var(--text);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 18px;
        margin-top: 36px;
      }

      .stat {
        background: rgba(31, 41, 55, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 12px;
        padding: 18px 16px;
      }

      .stat strong {
        display: block;
        font-size: 1.6rem;
        margin-bottom: 6px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">GitHub Pages</div>
      <h1>Coursera Test</h1>
      <p>
        This project is now set up to be hosted on GitHub Pages. The site is live once
        the Pages source is enabled in the repository settings and the branch is published.
      </p>

      <div class="actions">
        <a class="button primary" href="https://github.com/Abrahamkubour/coursera-test">View Repository</a>
        <a class="button secondary" href="https://github.com/Abrahamkubour/coursera-test/settings/pages">Open Pages Settings</a>
      </div>

      <div class="stats">
        <div class="stat">
          <strong>HTML</strong>
          <span>Static page</span>
        </div>
        <div class="stat">
          <strong>GitHub</strong>
          <span>Hosted on Pages</span>
        </div>
        <div class="stat">
          <strong>Ready</strong>
          <span>Publish from main branch</span>
        </div>
      </div>
    </main>
  </body>
</html>
